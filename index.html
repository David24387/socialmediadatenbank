<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Media Content Hub</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--blue:#164194;--ink:#172033;--muted:#667085;--line:#e3e8f0;--soft:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}.wrap{max-width:1380px;margin:auto;padding:20px 18px 55px}.topline{display:flex;justify-content:flex-end;margin-bottom:14px}.drivebtn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:12px 17px;font-size:12px;font-weight:800;text-decoration:none}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.platform{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 5px 18px #1528500f;cursor:pointer;text-align:left}.platform.active{border-color:var(--blue);box-shadow:inset 0 0 0 2px #1641941a}.platform b{display:block;font-size:16px}.platform span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin:24px 0 20px;flex-wrap:wrap}.search{flex:1;min-width:260px}.search input,.toolbar select{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff;outline:none}.search input{width:100%}.count{font-size:12px;color:var(--muted);margin-left:auto}.sync{font-size:11px;color:var(--muted);margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #18274b0d;cursor:pointer}.preview{aspect-ratio:4/5;background:#f2f4f8;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.placeholder{font-size:44px;opacity:.3}.badge,.carousel-mark{position:absolute;top:11px;font-size:9px;font-weight:800;padding:6px 8px;border-radius:8px}.badge{left:11px;background:#fff}.carousel-mark{right:11px;background:#172033;color:#fff}.body{padding:15px}.body h3{font-size:14px;margin:0 0 7px}.meta{font-size:10px;color:var(--muted);line-height:1.5;text-transform:capitalize}.view{border-radius:9px;padding:10px 12px;font-weight:700;font-size:10px;background:var(--blue);color:#fff;text-align:center;margin-top:13px}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}dialog{border:0;padding:0;box-shadow:0 28px 80px #0005}dialog::backdrop{background:#15213aab;backdrop-filter:blur(3px)}#detail{width:min(960px,92vw);border-radius:20px}.modal{display:grid;grid-template-columns:1.2fr .8fr;min-height:520px}.modal-media{background:#eef2f7;display:flex;align-items:center;justify-content:center;min-height:520px;position:relative}.modal-media img,.modal-media video{width:100%;height:100%;max-height:78vh;object-fit:contain}.modal-content{padding:34px;position:relative}.close{position:absolute;right:20px;top:20px;border:0;background:#f1f4f8;border-radius:50%;width:36px;height:36px;cursor:pointer;font-weight:700}.modal h2{font-size:24px;margin:45px 0 11px}.download{display:block;background:var(--blue);color:#fff;text-decoration:none;text-align:center;border-radius:9px;padding:13px;font-size:11px;font-weight:700;margin-top:26px}.navarrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:#fff;font-size:22px;cursor:pointer}.prev{left:14px}.next{right:14px}.slidecount{position:absolute;bottom:14px;background:#172033;color:#fff;border-radius:99px;padding:6px 10px;font-size:10px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.modal{grid-template-columns:1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}.platforms{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="topline"><a class="drivebtn" href="https://drive.google.com/drive/folders/1JYjGP0o9h531VFepYOD5i_hwRMn6evAT" target="_blank" rel="noopener">＋ Visual in Drive hochladen</a></div><nav class="platforms"><button class="platform active" data-platform="all"><b>Alle Visuals</b><span>Neueste Inhalte</span></button><button class="platform" data-platform="instagram"><b>Instagram</b><span>Posts & Carousels</span></button><button class="platform" data-platform="facebook"><b>Facebook</b><span>Bilder, Videos & Carousels</span></button><button class="platform" data-platform="linkedin"><b>LinkedIn</b><span>Corporate, B2B & Carousels</span></button></nav><section class="toolbar"><div class="search"><input id="search" placeholder="Visuals durchsuchen …"></div><select id="format"><option value="all">Alle Formate</option><option>Bild</option><option>Video</option><option>Reel</option><option>Carousel</option></select><select id="topic"><option value="all">Alle Bereiche</option></select><span class="count" id="count"></span></section><div class="sync" id="sync">Drive wird geladen …</div><section class="grid" id="grid"></section></main><dialog id="detail"><div class="modal"><div class="modal-media" id="modalMedia"></div><div class="modal-content"><button class="close" onclick="detail.close()">×</button><h2 id="modalTitle"></h2><div class="meta" id="modalMeta"></div><a class="download" id="downloadBtn" target="_blank" rel="noopener">Datei herunterladen ↓</a></div></div></dialog><script>const FEED='https://script.google.com/macros/s/AKfycbwr8piplT-7-OFPPuzuYjIEKFvr-WZ-3sR3-wIPBAAuPuHYVD0pWEiwMFaIUyeWOHQ/exec';let content=[],platform='all',current=null,slide=0;const $=id=>document.getElementById(id),grid=$('grid'),detail=$('detail');function norm(x){if(!x)return null;if(x.platform&&!x.platforms){x.platforms=x.platform==='reels'?['instagram','facebook']:[x.platform]}if(x.slides&&!x.files){x.files=x.slides.map(s=>s.download);x.previews=x.slides.map(s=>s.preview)}if(!x.file&&x.download)x.file=x.download;if(!x.preview&&x.slides?.[0])x.preview=x.slides[0].preview;x.topic=x.topic||({instagram:'Instagram',facebook:'Facebook',linkedin:'LinkedIn',reels:'Reels'}[x.platform]||'Social Media');return x}async function load(){try{let r=await fetch(FEED,{cache:'no-store'});if(!r.ok)throw new Error();let d=await r.json();content=(d.content||[]).map(norm).filter(Boolean);$('sync').textContent='Automatisch aus Google Drive · '+content.length+' Inhalte';topics();render()}catch(e){$('sync').textContent='Drive konnte nicht geladen werden. Bitte Web-App-Freigabe prüfen.';grid.innerHTML='<div class="empty">Aktuell können keine Drive-Inhalte geladen werden.</div>'}}function topics(){let a=[...new Set(content.map(x=>x.topic))].sort();$('topic').innerHTML='<option value="all">Alle Bereiche</option>'+a.map(x=>`<option>${x}</option>`).join('')}function fs(x){return x.files?.length?x.files:(x.file?[x.file]:[])}function ps(x){return x.previews?.length?x.previews:(x.preview?[x.preview]:fs(x))}function media(u,f,controls=false){if(!u)return '<div class="placeholder">▧</div>';if(['Video','Reel'].includes(f)&&controls)return `<video controls src="${u}"></video>`;return `<img src="${u}" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<div class=placeholder>▧</div>')">`}function render(){let q=$('search').value.toLowerCase(),f=$('format').value,t=$('topic').value,items=content.filter(x=>(platform==='all'||x.platforms?.includes(platform))&&(f==='all'||x.format===f)&&(t==='all'||x.topic===t)&&(!q||(String(x.title)+' '+x.topic).toLowerCase().includes(q)));$('count').textContent=items.length+' Visuals';grid.innerHTML=items.map(x=>`<article class="card" data-id="${x.id}"><div class="preview">${media(ps(x)[0],x.format)}<span class="badge">${String(x.format).toUpperCase()}</span>${x.format==='Carousel'?`<span class="carousel-mark">▣ ${fs(x).length}</span>`:''}</div><div class="body"><h3>${x.title||'Visual'}</h3><div class="meta">${x.platforms.join(' · ')} · ${x.topic}</div><div class="view">Visual ansehen</div></div></article>`).join('')||'<div class="empty">Keine passenden Visuals gefunden.</div>';document.querySelectorAll('.card').forEach(e=>e.onclick=()=>openItem(e.dataset.id))}function show(){let a=fs(current),p=ps(current),u=a[slide],prev=p[slide]||u;$('modalMedia').innerHTML=media(['Video','Reel'].includes(current.format)?u:prev,current.format,true)+(a.length>1?`<button class="navarrow prev" onclick="move(-1)">‹</button><button class="navarrow next" onclick="move(1)">›</button><span class="slidecount">${slide+1} / ${a.length}</span>`:'');$('downloadBtn').href=u||'#';$('downloadBtn').textContent=a.length>1?`Slide ${slide+1} herunterladen ↓`:'Datei herunterladen ↓'}function move(n){let a=fs(current);slide=(slide+n+a.length)%a.length;show()}function openItem(id){current=content.find(x=>String(x.id)===String(id));slide=0;$('modalTitle').textContent=current.title||'Visual';$('modalMeta').textContent=current.platforms.join(' · ')+' · '+current.format+' · '+current.topic;show();detail.showModal()}document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>{document.querySelectorAll('.platform').forEach(x=>x.classList.remove('active'));b.classList.add('active');platform=b.dataset.platform;render()});['search','format','topic'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));load();</script></body></html>
