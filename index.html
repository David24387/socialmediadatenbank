<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Media Content Hub</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--blue:#164194;--yellow:#FEDD00;--ink:#172033;--muted:#667085;--line:#e3e8f0;--soft:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}.wrap{max-width:1380px;margin:auto;padding:20px 18px 55px}.topline{display:flex;justify-content:flex-end;margin-bottom:14px}.upload-open,.primary{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:12px 17px;font-size:12px;font-weight:800;cursor:pointer}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.platform{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 5px 18px #1528500f;cursor:pointer;text-align:left}.platform.active{border-color:var(--blue);box-shadow:inset 0 0 0 2px #1641941a}.platform b{display:block;font-size:16px}.platform span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin:24px 0 20px;flex-wrap:wrap}.search{flex:1;min-width:260px}.search input,.toolbar select{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff;outline:none}.search input{width:100%}.count{font-size:12px;color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #18274b0d;cursor:pointer}.preview{aspect-ratio:4/5;background:#f2f4f8;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.placeholder{font-size:44px;opacity:.3}.badge,.carousel-mark{position:absolute;top:11px;font-size:9px;font-weight:800;padding:6px 8px;border-radius:8px}.badge{left:11px;background:#fff}.carousel-mark{right:11px;background:#172033;color:#fff}.body{padding:15px}.body h3{font-size:14px;margin:0 0 7px}.meta{font-size:10px;color:var(--muted);line-height:1.5}.view{display:block;border:0;border-radius:9px;padding:10px 12px;font-weight:700;font-size:10px;background:var(--blue);color:#fff;text-align:center;margin-top:13px}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}dialog{border:0;padding:0;box-shadow:0 28px 80px #0005}dialog::backdrop{background:#15213aab;backdrop-filter:blur(3px)}#detail{width:min(960px,92vw);border-radius:20px}.modal{display:grid;grid-template-columns:1.2fr .8fr;min-height:520px}.modal-media{background:#eef2f7;display:flex;align-items:center;justify-content:center;min-height:520px;position:relative}.modal-media img,.modal-media video{width:100%;height:100%;max-height:78vh;object-fit:contain}.modal-content{padding:34px;position:relative}.close{position:absolute;right:20px;top:20px;border:0;background:#f1f4f8;border-radius:50%;width:36px;height:36px;cursor:pointer;font-weight:700}.modal h2{font-size:24px;margin:45px 0 11px}.download{display:block;background:var(--blue);color:#fff;text-decoration:none;text-align:center;border-radius:9px;padding:13px;font-size:11px;font-weight:700;margin-top:26px}.navarrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:#fff;font-size:22px;cursor:pointer}.prev{left:14px}.next{right:14px}.slidecount{position:absolute;bottom:14px;background:#172033;color:#fff;border-radius:99px;padding:6px 10px;font-size:10px}#uploadDialog{width:min(760px,calc(100vw - 32px));border-radius:22px;overflow:hidden}.uploadbox{padding:34px 36px 30px;position:relative}.uploadbox h2{margin:0 48px 5px 0;font-size:23px}.intro{font-size:11px;color:var(--muted);line-height:1.5;margin:0 48px 22px 0}.dropzone{display:block;width:100%;border:1.5px dashed #c8d2e1;background:var(--soft);border-radius:14px;padding:24px 20px;text-align:center;cursor:pointer;margin:0 0 22px;min-height:112px}.dropzone:hover{border-color:var(--blue);background:#f2f6fc}.dropzone b{display:block;font-size:12px;margin:3px 0 6px}.dropzone span{display:block;font-size:10px;color:var(--muted)}#fileInput{display:none}.upload-preview{display:none;justify-content:center;margin-top:13px;gap:7px;overflow-x:auto}.upload-preview img,.upload-preview video{width:64px;height:76px;object-fit:cover;border-radius:7px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:17px 14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:9px;font-weight:800;margin-bottom:7px;color:#475467;letter-spacing:.02em}.field input,.field select{width:100%;height:47px;border:1px solid var(--line);border-radius:11px;padding:0 14px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#8aa5d8;box-shadow:0 0 0 3px #1641940d}.checks{display:flex;gap:10px;flex-wrap:wrap}.check{min-width:105px;height:52px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;cursor:pointer}.check:has(input:checked){border-color:var(--blue);background:#f3f6fc;color:var(--blue)}.check input{width:14px;height:14px;accent-color:var(--blue)}.upload-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:28px;padding-top:20px;border-top:1px solid #f0f2f5}.cancel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 15px;font-size:11px;font-weight:700;cursor:pointer}.status{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fff6cc;font-size:11px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.uploadbox{padding:28px 20px}.modal{grid-template-columns:1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}.platforms{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="topline"><button class="upload-open" onclick="uploadDialog.showModal()">＋ Visual hochladen</button></div><nav class="platforms"><button class="platform active" data-platform="all"><b>Alle Visuals</b><span>Neueste Inhalte</span></button><button class="platform" data-platform="instagram"><b>Instagram</b><span>Posts, Reels & Carousels</span></button><button class="platform" data-platform="facebook"><b>Facebook</b><span>Bilder, Videos & Carousels</span></button><button class="platform" data-platform="linkedin"><b>LinkedIn</b><span>Corporate, B2B & Carousels</span></button></nav><section class="toolbar"><div class="search"><input id="search" placeholder="Visuals durchsuchen …"></div><select id="format"><option value="all">Alle Formate</option><option>Bild</option><option>Video</option><option>Reel</option><option>Story</option><option>Carousel</option></select><select id="topic"><option value="all">Alle Themen</option></select><span class="count" id="count"></span></section><section class="grid" id="grid"></section></main><dialog id="detail"><div class="modal"><div class="modal-media" id="modalMedia"></div><div class="modal-content"><button class="close" onclick="detail.close()">×</button><h2 id="modalTitle"></h2><div class="meta" id="modalMeta"></div><a class="download" id="downloadBtn" download>Datei herunterladen ↓</a></div></div></dialog><dialog id="uploadDialog"><div class="uploadbox"><button class="close" onclick="uploadDialog.close()">×</button><h2>Visual hochladen</h2><p class="intro">Lade ein Bild oder Video hoch. Für einen Carousel-Post kannst du mehrere Dateien gleichzeitig auswählen.</p><label class="dropzone" for="fileInput"><b id="dropTitle">Datei auswählen oder hier ablegen</b><span id="dropHint">Bilder und Videos · bei Carousel mehrere Dateien möglich</span><input type="file" id="fileInput" accept="image/*,video/*" multiple><div class="upload-preview" id="uploadPreview"></div></label><div class="formgrid"><div class="field full"><label>TITEL</label><input id="upTitle" placeholder="z. B. Winterreifen-Check"></div><div class="field"><label>THEMA</label><input id="upTopic" placeholder="z. B. Werkstattwissen"></div><div class="field"><label>FORMAT</label><select id="upFormat"><option>Bild</option><option>Video</option><option>Reel</option><option>Story</option><option>Carousel</option></select></div><div class="field full"><label>PLATTFORMEN</label><div class="checks"><label class="check"><input type="checkbox" value="instagram" name="upPlatform">Instagram</label><label class="check"><input type="checkbox" value="facebook" name="upPlatform">Facebook</label><label class="check"><input type="checkbox" value="linkedin" name="upPlatform">LinkedIn</label></div></div></div><div class="status" id="uploadStatus"></div><div class="upload-actions"><button class="cancel" onclick="uploadDialog.close()">Abbrechen</button><button class="primary" id="publishBtn">Visual veröffentlichen</button></div></div></dialog><script>let content=[],platform='all',current=null,slide=0,chosenFiles=[];const $=id=>document.getElementById(id),grid=$('grid'),detail=$('detail');fetch('content.json').then(r=>r.json()).then(d=>{content=d;topics();render()});function topics(){let a=[...new Set(content.map(x=>x.topic))].sort();$('topic').innerHTML='<option value="all">Alle Themen</option>'+a.map(x=>`<option>${x}</option>`).join('')}function fs(x){return x.files?.length?x.files:(x.file?[x.file]:[])}function media(u,f,controls=false){if(!u)return '<div class="placeholder">▧</div>';if(/\.(mp4|webm|mov)$/i.test(u)||u.startsWith('blob:')&&['Video','Reel'].includes(f))return `<video ${controls?'controls':'muted'} src="${u}"></video>`;return `<img src="${u}">`}function render(){let q=$('search').value.toLowerCase(),f=$('format').value,t=$('topic').value,items=content.filter(x=>(platform==='all'||x.platforms.includes(platform))&&(f==='all'||x.format===f)&&(t==='all'||x.topic===t)&&(!q||(x.title+' '+x.topic).toLowerCase().includes(q)));$('count').textContent=items.length+' Visuals';grid.innerHTML=items.map(x=>`<article class="card" data-id="${x.id}"><div class="preview">${media(fs(x)[0],x.format)}<span class="badge">${x.format.toUpperCase()}</span>${x.format==='Carousel'?`<span class="carousel-mark">▣ ${fs(x).length||'+'}</span>`:''}</div><div class="body"><h3>${x.title}</h3><div class="meta">${x.platforms.join(' · ')} · ${x.topic}</div><div class="view">Visual ansehen</div></div></article>`).join('')||'<div class="empty">Keine passenden Visuals gefunden.</div>';document.querySelectorAll('.card').forEach(e=>e.onclick=()=>openItem(e.dataset.id))}function show(){let a=fs(current),u=a[slide];$('modalMedia').innerHTML=media(u,current.format,true)+(a.length>1?`<button class="navarrow prev" onclick="move(-1)">‹</button><button class="navarrow next" onclick="move(1)">›</button><span class="slidecount">${slide+1} / ${a.length}</span>`:'');$('downloadBtn').href=u||'#';$('downloadBtn').textContent=a.length>1?`Slide ${slide+1} herunterladen ↓`:'Datei herunterladen ↓';$('downloadBtn').style.display=u?'block':'none'}function move(n){let a=fs(current);slide=(slide+n+a.length)%a.length;show()}function openItem(id){current=content.find(x=>String(x.id)===String(id));slide=0;$('modalTitle').textContent=current.title;$('modalMeta').textContent=current.platforms.join(' · ')+' · '+current.format+' · '+current.topic;show();detail.showModal()}document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>{document.querySelectorAll('.platform').forEach(x=>x.classList.remove('active'));b.classList.add('active');platform=b.dataset.platform;render()});['search','format','topic'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('fileInput').onchange=()=>{chosenFiles=[...$('fileInput').files];$('uploadPreview').style.display='flex';$('uploadPreview').innerHTML=chosenFiles.map(f=>{let u=URL.createObjectURL(f);return f.type.startsWith('video/')?`<video muted src="${u}"></video>`:`<img src="${u}">`}).join('');if(chosenFiles.length>1)$('upFormat').value='Carousel';$('dropTitle').textContent=chosenFiles.length+' Datei'+(chosenFiles.length===1?'':'en')+' ausgewählt'};$('publishBtn').onclick=()=>{let ps=[...document.querySelectorAll('[name=upPlatform]:checked')].map(x=>x.value),status=$('uploadStatus');if(!chosenFiles.length||!$('upTitle').value.trim()||!$('upTopic').value.trim()||!ps.length){status.style.display='block';status.textContent='Bitte Datei(en), Titel, Thema und mindestens eine Plattform auswählen.';return}if($('upFormat').value==='Carousel'&&chosenFiles.length<2){status.style.display='block';status.textContent='Für einen Carousel-Post bitte mindestens zwei Dateien auswählen.';return}let urls=chosenFiles.map(URL.createObjectURL);content.unshift({id:'local-'+Date.now(),title:$('upTitle').value.trim(),topic:$('upTopic').value.trim(),format:$('upFormat').value,platforms:ps,file:urls[0],files:$('upFormat').value==='Carousel'?urls:undefined});topics();render();$('uploadDialog').close()};</script></body></html>
