<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Media Content Hub</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--blue:#164194;--ink:#172033;--muted:#667085;--line:#e3e8f0}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}.wrap{max-width:1380px;margin:auto;padding:20px 18px 55px}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.platform{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 5px 18px #1528500f;cursor:pointer;text-align:left}.platform.active{border-color:var(--blue);box-shadow:inset 0 0 0 2px #1641941a}.platform b{display:block;font-size:16px}.platform span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin:24px 0 20px;flex-wrap:wrap}.search{flex:1;min-width:260px}.search input,.toolbar select{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff}.search input{width:100%}.count{font-size:12px;color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #18274b0d}.preview{aspect-ratio:4/5;background:#f2f4f8;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.card.reel .preview{aspect-ratio:9/16;max-height:470px;background:#111}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.card.reel .preview img,.card.reel .preview video{object-fit:contain}.placeholder{font-size:44px;opacity:.3}.badge,.carousel-mark{position:absolute;top:11px;font-size:9px;font-weight:800;padding:6px 8px;border-radius:8px;z-index:2}.badge{left:11px;background:#fff}.carousel-mark{right:11px;background:#172033;color:#fff}.body{padding:15px}.body h3{font-size:14px;margin:0 0 7px}.meta{font-size:10px;color:var(--muted);line-height:1.5}.download{display:block;border:0;width:100%;border-radius:9px;padding:11px 12px;font-weight:700;font-size:10px;background:var(--blue);color:#fff;text-align:center;text-decoration:none;margin-top:13px;cursor:pointer}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}.platforms{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><nav class="platforms"><button class="platform active" data-platform="all"><b>Alle Visuals</b><span>Neueste Inhalte</span></button><button class="platform" data-platform="instagram"><b>Instagram</b><span>Posts, Reels & Carousels</span></button><button class="platform" data-platform="facebook"><b>Facebook</b><span>Bilder, Videos & Carousels</span></button><button class="platform" data-platform="linkedin"><b>LinkedIn</b><span>Corporate, B2B & Carousels</span></button></nav><section class="toolbar"><div class="search"><input id="search" placeholder="Visuals durchsuchen …"></div><select id="format"><option value="all">Alle Formate</option><option>Bild</option><option>Video</option><option>Reel</option><option>Carousel</option></select><select id="topic"><option value="all">Alle Themen</option></select><span class="count" id="count"></span></section><section class="grid" id="grid"><div class="empty">Drive-Inhalte werden geladen …</div></section></main><script>const API='https://script.google.com/macros/s/AKfycbwr8piplT-7-OFPPuzuYjIEKFvr-WZ-3sR3-wIPBAAuPuHYVD0pWEiwMFaIUyeWOHQ/exec';let content=[],platform='all';const $=id=>document.getElementById(id),grid=$('grid');const cap=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1):'';function normalize(x){let p=Array.isArray(x.platforms)?x.platforms:(x.platform?[x.platform]:[]);p=p.map(v=>String(v).toLowerCase());if(p.includes('reels'))p=['instagram','facebook'];let slides=Array.isArray(x.slides)?x.slides:[];let files=Array.isArray(x.files)?x.files:slides.map(s=>s.download||s.file).filter(Boolean);let previews=Array.isArray(x.previews)?x.previews:slides.map(s=>s.preview||s.download||s.file).filter(Boolean);let format=x.format||((files.length>1||slides.length>1)?'Carousel':'Bild');if(files.length>1)format='Carousel';return {...x,platforms:p,format,topic:x.topic||cap(x.platform)||'Social Media',files,previews,file:x.file||x.download||(files[0]||''),preview:x.preview||(previews[0]||x.file||x.download||files[0]||''),title:x.title||x.name||'Visual'}}async function load(){try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error();let d=await r.json();content=(d.content||d).filter(Boolean).map(normalize);topics();render()}catch(e){grid.innerHTML='<div class="empty">Drive-Inhalte konnten nicht geladen werden.</div>'}}function topics(){let a=[...new Set(content.map(x=>x.topic).filter(Boolean))].sort();$('topic').innerHTML='<option value="all">Alle Themen</option>'+a.map(x=>`<option>${x}</option>`).join('')}function isVideo(x){return x.format==='Video'||x.format==='Reel'||/video/i.test(x.mimeType||'')}function previewUrl(x){return x.preview||x.previews?.[0]||x.file}function visual(x){let u=previewUrl(x);if(!u)return '<div class="placeholder">▧</div>';if(isVideo(x))return `<video muted playsinline preload="metadata" src="${x.file}"></video>`;return `<img loading="lazy" src="${u}" alt="">`}function dl(u){let a=document.createElement('a');a.href=u;a.download='';a.target='_blank';document.body.appendChild(a);a.click();a.remove()}function downloadItem(id){let x=content.find(v=>String(v.id)===String(id));let a=x.files?.length?x.files:[x.file];a.filter(Boolean).forEach((u,i)=>setTimeout(()=>dl(u),i*350))}function render(){let q=$('search').value.toLowerCase(),f=$('format').value,t=$('topic').value;let items=content.filter(x=>(platform==='all'||x.platforms.includes(platform))&&(f==='all'||x.format===f)&&(t==='all'||x.topic===t)&&(!q||(x.title+' '+x.topic).toLowerCase().includes(q)));$('count').textContent=items.length+' Visuals';grid.innerHTML=items.map(x=>`<article class="card ${x.format==='Reel'?'reel':''}"><div class="preview">${visual(x)}<span class="badge">${x.format.toUpperCase()}</span>${x.format==='Carousel'?`<span class="carousel-mark">▣ ${x.files.length}</span>`:''}</div><div class="body"><h3>${x.title}</h3><div class="meta">${x.platforms.map(cap).join(' · ')} · ${x.topic}</div><button class="download" onclick="downloadItem('${x.id}')">${x.format==='Carousel'?'Carousel herunterladen':'Download'}</button></div></article>`).join('')||'<div class="empty">Keine passenden Visuals gefunden.</div>'}document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>{document.querySelectorAll('.platform').forEach(x=>x.classList.remove('active'));b.classList.add('active');platform=b.dataset.platform;render()});['search','format','topic'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));load();</script></body></html>
