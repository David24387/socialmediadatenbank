<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Media Content Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--blue:#164194;--yellow:#FEDD00;--ink:#172033;--muted:#667085;--bg:#fff;--line:#e7eaf0}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}.wrap{max-width:1380px;margin:auto;padding:20px 18px 55px}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.platform{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 5px 18px rgba(21,40,80,.06);cursor:pointer;text-align:left;transition:.2s}.platform:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(21,40,80,.1)}.platform.active{border-color:var(--blue);box-shadow:inset 0 0 0 2px rgba(22,65,148,.10),0 6px 20px rgba(21,40,80,.08)}.platform b{display:block;font-size:16px}.platform span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin:24px 0 20px;flex-wrap:wrap}.search{flex:1;min-width:260px}.search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff;outline:none}.search input:focus,.toolbar select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,65,148,.08)}.toolbar select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px;outline:none}.count{font-size:12px;color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px rgba(24,39,75,.05);transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(24,39,75,.1)}.preview{aspect-ratio:4/5;background:#f2f4f8;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.placeholder{font-size:44px;opacity:.32}.badges{position:absolute;top:11px;left:11px;display:flex;gap:6px}.badge{font-size:9px;font-weight:800;padding:6px 8px;border-radius:99px;background:#fff;box-shadow:0 2px 10px #0001}.new{background:var(--yellow)}.body{padding:15px}.body h3{font-size:14px;margin:0 0 7px}.meta{font-size:10px;color:var(--muted);line-height:1.5}.btn{display:block;border:0;border-radius:9px;padding:10px 12px;font-weight:700;font-size:10px;cursor:pointer;background:var(--blue);color:#fff;text-align:center;text-decoration:none;margin-top:13px}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;width:min(960px,92vw);box-shadow:0 30px 80px #0005}dialog::backdrop{background:#0d1733b8;backdrop-filter:blur(4px)}.modal{display:grid;grid-template-columns:1.2fr .8fr;min-height:520px}.modal-media{background:#eef2f7;display:flex;align-items:center;justify-content:center;min-height:520px}.modal-media img,.modal-media video{width:100%;height:100%;max-height:78vh;object-fit:contain}.modal-content{padding:34px;position:relative}.close{position:absolute;right:18px;top:17px;border:0;background:#f0f2f6;border-radius:50%;width:35px;height:35px;cursor:pointer}.modal h2{font-size:24px;margin:45px 0 11px}.download{margin-top:26px;padding:13px}.hint{margin-top:26px;font-size:11px;color:var(--muted);line-height:1.55}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.wrap{padding:14px 12px 40px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.modal{grid-template-columns:1fr}.modal-media{min-height:320px}.platform{padding:14px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.platforms{grid-template-columns:1fr 1fr}.toolbar select{width:calc(50% - 5px)}}</style></head><body><main class="wrap"><nav class="platforms"><button class="platform active" data-platform="all"><b>Alle Visuals</b><span>Neueste Inhalte</span></button><button class="platform" data-platform="instagram"><b>Instagram</b><span>Posts, Reels & Stories</span></button><button class="platform" data-platform="facebook"><b>Facebook</b><span>Bilder & Videos</span></button><button class="platform" data-platform="linkedin"><b>LinkedIn</b><span>Corporate & B2B</span></button></nav><section class="toolbar"><div class="search"><input id="search" placeholder="Visuals durchsuchen …"></div><select id="format"><option value="all">Alle Formate</option><option>Bild</option><option>Video</option><option>Reel</option><option>Story</option></select><select id="topic"><option value="all">Alle Themen</option></select><span class="count" id="count"></span></section><section class="grid" id="grid"></section></main><dialog id="detail"><div class="modal"><div class="modal-media" id="modalMedia"></div><div class="modal-content"><button class="close" onclick="detail.close()">×</button><h2 id="modalTitle"></h2><div class="meta" id="modalMeta"></div><a class="btn download" id="downloadBtn" download>Datei herunterladen ↓</a><p class="hint">Das Visual ist für die oben genannten Social-Media-Kanäle freigegeben.</p></div></div></dialog><script>let content=[],platform='all';const grid=document.querySelector('#grid'),detail=document.querySelector('#detail');fetch('content.json').then(r=>r.json()).then(d=>{content=d;buildTopics();render()}).catch(()=>grid.innerHTML='<div class="empty">Content konnte nicht geladen werden.</div>');function buildTopics(){let a=[...new Set(content.map(x=>x.topic))].sort();topic.innerHTML='<option value="all">Alle Themen</option>'+a.map(x=>`<option>${x}</option>`).join('')}function media(x,m=false){if(!x.file)return '<div class="placeholder">'+(['Video','Reel'].includes(x.format)?'▶':'▧')+'</div>';if(/\.(mp4|webm|mov)$/i.test(x.file))return `<video ${m?'controls':'muted'} preload="metadata" src="${x.file}"></video>`;return `<img src="${x.file}" alt="${x.title}">`}function render(){let q=search.value.toLowerCase(),f=format.value,t=topic.value,items=content.filter(x=>(platform==='all'||x.platforms.includes(platform))&&(f==='all'||x.format===f)&&(t==='all'||x.topic===t)&&(!q||(x.title+' '+x.topic).toLowerCase().includes(q)));count.textContent=items.length+' Visuals';grid.innerHTML=items.length?items.map(x=>`<article class="card" data-id="${x.id}"><div class="preview">${media(x)}<div class="badges">${x.new?'<span class="badge new">NEU</span>':''}<span class="badge">${x.format.toUpperCase()}</span></div></div><div class="body"><h3>${x.title}</h3><div class="meta">${x.platforms.map(p=>p[0].toUpperCase()+p.slice(1)).join(' · ')} · ${x.topic}</div><div class="btn">Visual ansehen</div></div></article>`).join(''):'<div class="empty">Keine passenden Visuals gefunden.</div>';document.querySelectorAll('.card').forEach(e=>e.onclick=()=>openItem(e.dataset.id))}function openItem(id){let x=content.find(i=>String(i.id)===String(id));modalMedia.innerHTML=media(x,true);modalTitle.textContent=x.title;modalMeta.textContent=x.platforms.map(p=>p[0].toUpperCase()+p.slice(1)).join(' · ')+' · '+x.format+' · '+x.topic;downloadBtn.href=x.file||'#';downloadBtn.style.display=x.file?'block':'none';detail.showModal()}document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>{document.querySelectorAll('.platform').forEach(x=>x.classList.remove('active'));b.classList.add('active');platform=b.dataset.platform;render()});['search','format','topic'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='search'?'input':'change',render));detail.addEventListener('click',e=>{if(e.target===detail)detail.close()});</script></body></html>
