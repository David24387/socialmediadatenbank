<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Media Content Hub</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--blue:#164194;--ink:#172033;--muted:#667085;--line:#e3e8f0}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}.wrap{max-width:1380px;margin:auto;padding:20px 18px 55px}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.platform{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 5px 18px #1528500f;cursor:pointer;text-align:left}.platform.active{border-color:var(--blue);box-shadow:inset 0 0 0 2px #1641941a}.platform b{display:block;font-size:16px}.platform span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin:24px 0 20px;flex-wrap:wrap}.search{flex:1;min-width:260px}.search input,.toolbar select{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff}.search input{width:100%}.count{font-size:12px;color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #18274b0d}.preview{aspect-ratio:4/5;background:#f2f4f8;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}.card.reel .preview{aspect-ratio:9/16;max-height:470px;background:#111}.preview img{width:100%;height:100%;object-fit:cover}.card.reel .preview img{object-fit:contain}.video-thumb{width:100%;height:100%;object-fit:cover}.card.reel .video-thumb{object-fit:contain}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#fff;color:#172033;display:grid;place-items:center;font-size:22px;box-shadow:0 5px 20px #0004;padding-left:4px}.placeholder{font-size:44px;opacity:.3}.badge,.carousel-mark{position:absolute;top:11px;font-size:9px;font-weight:800;padding:6px 8px;border-radius:8px;z-index:2}.badge{left:11px;background:#fff}.carousel-mark{right:11px;background:#172033;color:#fff}.body{padding:15px}.body h3{font-size:14px;margin:0 0 7px}.meta{font-size:10px;color:var(--muted);line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.btn{border:0;border-radius:9px;padding:11px 10px;font-weight:700;font-size:10px;cursor:pointer;text-align:center}.view{background:#eef2f8;color:var(--blue)}.download{background:var(--blue);color:#fff}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}dialog{border:0;padding:0;border-radius:18px;width:min(1000px,94vw);max-height:92vh;box-shadow:0 30px 90px #0007;background:#fff}dialog::backdrop{background:#0b1224cc;backdrop-filter:blur(4px)}.viewer{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:560px}.viewer-media{background:#101217;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}.viewer-media img,.viewer-media video{display:block;max-width:100%;max-height:82vh;width:auto;height:auto;object-fit:contain}.viewer-info{padding:28px;position:relative}.viewer-info h2{font-size:20px;margin:42px 0 9px;line-height:1.3}.close{position:absolute;right:18px;top:16px;border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:20px}.viewer-download{width:100%;margin-top:22px}.nav{position:absolute;top:50%;transform:translateY(-50%);border:0;width:42px;height:42px;border-radius:50%;background:#fff;cursor:pointer;font-size:24px;box-shadow:0 3px 16px #0005}.prev{left:14px}.next{right:14px}.counter{position:absolute;bottom:14px;background:#000b;color:#fff;border-radius:99px;padding:7px 11px;font-size:10px;font-weight:700}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.viewer{grid-template-columns:1fr}.viewer-info{padding:20px}.viewer-media{min-height:55vh}}@media(max-width:450px){.grid{grid-template-columns:1fr}.platforms{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><nav class="platforms"><button class="platform active" data-platform="all"><b>Alle Visuals</b><span>Neueste Inhalte</span></button><button class="platform" data-platform="instagram"><b>Instagram</b><span>Posts, Reels & Carousels</span></button><button class="platform" data-platform="facebook"><b>Facebook</b><span>Bilder, Videos & Carousels</span></button><button class="platform" data-platform="linkedin"><b>LinkedIn</b><span>Corporate, B2B & Carousels</span></button></nav><section class="toolbar"><div class="search"><input id="search" placeholder="Visuals durchsuchen …"></div><select id="format"><option value="all">Alle Formate</option><option>Bild</option><option>Video</option><option>Reel</option><option>Carousel</option></select><select id="topic"><option value="all">Alle Themen</option></select><span class="count" id="count"></span></section><section class="grid" id="grid"><div class="empty">Drive-Inhalte werden geladen …</div></section></main><dialog id="viewer"><div class="viewer"><div class="viewer-media" id="viewerMedia"></div><aside class="viewer-info"><button class="close" onclick="viewer.close()">×</button><h2 id="viewerTitle"></h2><div class="meta" id="viewerMeta"></div><button class="btn download viewer-download" id="viewerDownload">Download</button></aside></div></dialog><script>const API='https://script.google.com/macros/s/AKfycbxLyMH62TiCr87fySxAU-pRqMLts9SnVrNmd6bt2pdi9A_hCxnqP9yzktB--nC_JxM/exec';let content=[],platform='all',current=null,slide=0;const $=id=>document.getElementById(id),grid=$('grid'),viewer=$('viewer');const cap=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1):'';function normalize(x){let p=Array.isArray(x.platforms)?x.platforms:(x.platform?[x.platform]:[]);p=p.map(v=>String(v).toLowerCase());if(p.includes('reels'))p=['instagram','facebook'];let slides=Array.isArray(x.slides)?x.slides:[];let files=Array.isArray(x.files)?x.files:slides.map(s=>s.download||s.file).filter(Boolean);let previews=Array.isArray(x.previews)?x.previews:slides.map(s=>s.preview||s.download||s.file).filter(Boolean);let format=x.format||((files.length>1||slides.length>1)?'Carousel':'Bild');if(files.length>1||slides.length>1)format='Carousel';return {...x,platforms:p,format,topic:x.topic||cap(x.platform)||'Social Media',slides,files,previews,file:x.file||x.download||(files[0]||''),preview:x.preview||(previews[0]||x.file||x.download||files[0]||''),title:x.title||x.name||'Visual'}}async function load(){try{let r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();let d=await r.json();content=(d.content||d).filter(Boolean).map(normalize);topics();render()}catch(e){grid.innerHTML='<div class="empty">Drive-Inhalte konnten nicht geladen werden.</div>'}}function topics(){let a=[...new Set(content.map(x=>x.topic).filter(Boolean))].sort();$('topic').innerHTML='<option value="all">Alle Themen</option>'+a.map(x=>`<option>${x}</option>`).join('')}function isVideo(x){return x.format==='Video'||x.format==='Reel'||/video/i.test(x.mimeType||'')}function previewUrl(x){return x.preview||x.previews?.[0]||x.file}function cardVisual(x){let u=previewUrl(x);if(!u)return '<div class="placeholder">▧</div>';if(isVideo(x))return `<img class="video-thumb" loading="lazy" src="${x.preview}" alt="Video Vorschau" onerror="this.style.display='none'"><span class="play">▶</span>`;return `<img loading="lazy" src="${u}" alt="">`}function dl(u){let a=document.createElement('a');a.href=u;a.download='';a.target='_blank';document.body.appendChild(a);a.click();a.remove()}function downloadItem(id){let x=content.find(v=>String(v.id)===String(id));let a=x.files?.length?x.files:[x.file];a.filter(Boolean).forEach((u,i)=>setTimeout(()=>dl(u),i*450))}function slideData(x,i){if(x.slides?.length)return x.slides[i];return {download:x.files?.[i]||x.file,preview:x.previews?.[i]||x.preview,mimeType:x.mimeType||''}}function showSlide(){let total=current.format==='Carousel'?Math.max(current.slides.length,current.files.length):1;let s=slideData(current,slide),video=/video/i.test(s.mimeType||'')||(total===1&&isVideo(current));let src=s.download||current.file;let poster=s.preview||current.preview||'';$('viewerMedia').innerHTML=(video?`<video controls playsinline preload="metadata" poster="${poster}" src="${src}"></video>`:`<img src="${s.preview||src}" alt="">`)+(total>1?`<button class="nav prev" onclick="move(-1)">‹</button><button class="nav next" onclick="move(1)">›</button><span class="counter">${slide+1} / ${total}</span>`:'')}function move(n){let total=Math.max(current.slides.length,current.files.length);slide=(slide+n+total)%total;showSlide()}function openViewer(id){current=content.find(v=>String(v.id)===String(id));slide=0;$('viewerTitle').textContent=current.title;$('viewerMeta').textContent=current.platforms.map(cap).join(' · ')+' · '+current.format+' · '+current.topic;$('viewerDownload').textContent=current.format==='Carousel'?'Carousel herunterladen':'Download';$('viewerDownload').onclick=()=>downloadItem(current.id);showSlide();viewer.showModal()}function render(){let q=$('search').value.toLowerCase(),f=$('format').value,t=$('topic').value;let items=content.filter(x=>(platform==='all'||x.platforms.includes(platform))&&(f==='all'||x.format===f)&&(t==='all'||x.topic===t)&&(!q||(x.title+' '+x.topic).toLowerCase().includes(q)));$('count').textContent=items.length+' Visuals';grid.innerHTML=items.map(x=>`<article class="card ${x.format==='Reel'?'reel':''}"><div class="preview" onclick="openViewer('${x.id}')">${cardVisual(x)}<span class="badge">${x.format.toUpperCase()}</span>${x.format==='Carousel'?`<span class="carousel-mark">▣ ${x.files.length} Slides</span>`:''}</div><div class="body"><h3>${x.title}</h3><div class="meta">${x.platforms.map(cap).join(' · ')} · ${x.topic}</div><div class="actions"><button class="btn view" onclick="openViewer('${x.id}')">Ansehen</button><button class="btn download" onclick="downloadItem('${x.id}')">Download</button></div></div></article>`).join('')||'<div class="empty">Keine passenden Visuals gefunden.</div>'}document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>{document.querySelectorAll('.platform').forEach(x=>x.classList.remove('active'));b.classList.add('active');platform=b.dataset.platform;render()});['search','format','topic'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});load();</script></body></html>
