<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Media Content Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--blue:#164194;--yellow:#FEDD00;--ink:#172033;--muted:#667085;--line:#e7eaf0;--soft:#f6f8fb}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}.wrap{max-width:1380px;margin:auto;padding:20px 18px 55px}.topline{display:flex;justify-content:flex-end;margin-bottom:14px}.upload-open{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:12px 17px;font-size:12px;font-weight:800;cursor:pointer}.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.platform{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 5px 18px #1528500f;cursor:pointer;text-align:left}.platform.active{border-color:var(--blue);box-shadow:inset 0 0 0 2px #1641941a}.platform b{display:block;font-size:16px}.platform span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin:24px 0 20px;flex-wrap:wrap}.search{flex:1;min-width:260px}.search input,.toolbar select,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff;outline:none}.toolbar select{width:auto}.count{font-size:12px;color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #18274b0d;cursor:pointer}.preview{aspect-ratio:4/5;background:#f2f4f8;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.placeholder{font-size:44px;opacity:.32}.badges{position:absolute;top:11px;left:11px;display:flex;gap:6px}.badge{font-size:9px;font-weight:800;padding:6px 8px;border-radius:99px;background:#fff}.new{background:var(--yellow)}.carousel-mark{position:absolute;right:11px;top:11px;background:#172033;color:#fff;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:800}.body{padding:15px}.body h3{font-size:14px;margin:0 0 7px}.meta{font-size:10px;color:var(--muted);line-height:1.5}.btn{display:block;border:0;border-radius:9px;padding:10px 12px;font-weight:700;font-size:10px;cursor:pointer;background:var(--blue);color:#fff;text-align:center;text-decoration:none;margin-top:13px}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;box-shadow:0 30px 80px #0005}dialog::backdrop{background:#0d1733b8;backdrop-filter:blur(4px)}#detail{width:min(960px,92vw)}.modal{display:grid;grid-template-columns:1.2fr .8fr;min-height:520px}.modal-media{background:#eef2f7;display:flex;align-items:center;justify-content:center;min-height:520px;position:relative}.modal-media img,.modal-media video{width:100%;height:100%;max-height:78vh;object-fit:contain}.navarrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:22px;cursor:pointer;box-shadow:0 3px 14px #0002}.prev{left:14px}.next{right:14px}.slidecount{position:absolute;bottom:14px;background:#172033;color:#fff;border-radius:99px;padding:6px 10px;font-size:10px}.modal-content{padding:34px;position:relative}.close{position:absolute;right:18px;top:17px;border:0;background:#f0f2f6;border-radius:50%;width:35px;height:35px;cursor:pointer}.modal h2{font-size:24px;margin:45px 0 11px}.download{margin-top:26px;padding:13px}.downloadall{background:#eef2f8;color:var(--blue)}.hint{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.55}#uploadDialog{width:min(720px,94vw)}.uploadbox{padding:30px;position:relative}.uploadbox h2{margin:0 0 6px;font-size:22px}.uploadbox>p{font-size:12px;color:var(--muted);margin:0 0 24px}.dropzone{border:2px dashed #cfd6e3;background:var(--soft);border-radius:16px;padding:26px;text-align:center;cursor:pointer;margin-bottom:20px}.dropzone b{display:block;font-size:13px;margin-bottom:6px}.dropzone span{font-size:11px;color:var(--muted)}#fileInput{display:none}.upload-preview{display:none;margin-top:14px;gap:7px;overflow-x:auto}.upload-preview img,.upload-preview video{width:76px;height:95px;object-fit:cover;border-radius:8px;flex:0 0 auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;font-weight:800;margin:0 0 6px;color:#475467}.checks{display:flex;gap:9px;flex-wrap:wrap}.check{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px}.upload-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.cancel,.publish{border-radius:10px;padding:11px 15px;font-size:11px;font-weight:700;cursor:pointer}.cancel{border:1px solid var(--line);background:#fff}.publish{border:0;background:var(--blue);color:#fff}.status{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fff6cc;font-size:11px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.modal{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:480px){.grid{grid-template-columns:1fr}.platforms{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="topline"><button class="upload-open" onclick="uploadDialog.showModal()">＋ Visual hochladen</button></div><nav class="platforms"><button class="platform active" data-platform="all"><b>Alle Visuals</b><span>Neueste Inhalte</span></button><button class="platform" data-platform="instagram"><b>Instagram</b><span>Posts, Reels & Carousels</span></button><button class="platform" data-platform="facebook"><b>Facebook</b><span>Bilder, Videos & Carousels</span></button><button class="platform" data-platform="linkedin"><b>LinkedIn</b><span>Corporate, B2B & Carousels</span></button></nav><section class="toolbar"><div class="search"><input id="search" placeholder="Visuals durchsuchen …"></div><select id="format"><option value="all">Alle Formate</option><option>Bild</option><option>Video</option><option>Reel</option><option>Story</option><option>Carousel</option></select><select id="topic"><option value="all">Alle Themen</option></select><span class="count" id="count"></span></section><section class="grid" id="grid"></section></main><dialog id="detail"><div class="modal"><div class="modal-media" id="modalMedia"></div><div class="modal-content"><button class="close" onclick="detail.close()">×</button><h2 id="modalTitle"></h2><div class="meta" id="modalMeta"></div><a class="btn download" id="downloadBtn" download>Datei herunterladen ↓</a><button class="btn downloadall" id="downloadAllBtn" style="display:none">Alle Carousel-Dateien herunterladen</button><p class="hint">Das Visual ist für die oben genannten Social-Media-Kanäle freigegeben.</p></div></div></dialog><dialog id="uploadDialog"><div class="uploadbox"><button class="close" onclick="uploadDialog.close()">×</button><h2>Visual hochladen</h2><p>Bei Carousel-Posts kannst du mehrere Dateien gleichzeitig auswählen. Die Reihenfolge entspricht der Auswahl.</p><label class="dropzone" for="fileInput"><b id="dropTitle">Bild oder Video hier auswählen</b><span id="dropHint">Für Carousel mehrere Dateien auswählen</span><input type="file" id="fileInput" accept="image/*,video/*" multiple><div class="upload-preview" id="uploadPreview"></div></label><div class="formgrid"><div class="field full"><label>TITEL</label><input id="upTitle" placeholder="z. B. Winterreifen-Check"></div><div class="field"><label>THEMA</label><input id="upTopic" placeholder="z. B. Werkstattwissen"></div><div class="field"><label>FORMAT</label><select id="upFormat"><option>Bild</option><option>Video</option><option>Reel</option><option>Story</option><option>Carousel</option></select></div><div class="field full"><label>FÜR WELCHE PLATTFORM?</label><div class="checks"><label class="check"><input type="checkbox" value="instagram" name="upPlatform"> Instagram</label><label class="check"><input type="checkbox" value="facebook" name="upPlatform"> Facebook</label><label class="check"><input type="checkbox" value="linkedin" name="upPlatform"> LinkedIn</label></div></div></div><div class="status" id="uploadStatus"></div><div class="upload-actions"><button class="cancel" onclick="uploadDialog.close()">Abbrechen</button><button class="publish" id="publishBtn">Visual veröffentlichen</button></div></div></dialog><script>let content=[],platform='all',current=null,slide=0,chosenFiles=[];const grid=document.querySelector('#grid'),detail=document.querySelector('#detail');fetch('content.json').then(r=>r.json()).then(d=>{content=d;buildTopics();render()});function buildTopics(){let a=[...new Set(content.map(x=>x.topic))].sort();topic.innerHTML='<option value="all">Alle Themen</option>'+a.map(x=>`<option>${x}</option>`).join('')}function filesOf(x){return x.files?.length?x.files:(x.file?[x.file]:[])}function oneMedia(url,format,m=false){if(!url)return '<div class="placeholder">▧</div>';if(/\.(mp4|webm|mov)$/i.test(url)||url.startsWith('blob:')&&['Video','Reel'].includes(format))return `<video ${m?'controls':'muted'} preload="metadata" src="${url}"></video>`;return `<img src="${url}">`}function preview(x){let fs=filesOf(x);return oneMedia(fs[0],x.format)+ (x.format==='Carousel'?`<span class="carousel-mark">▣ ${fs.length||'+'}</span>`:'')}function render(){let q=search.value.toLowerCase(),f=format.value,t=topic.value,items=content.filter(x=>(platform==='all'||x.platforms.includes(platform))&&(f==='all'||x.format===f)&&(t==='all'||x.topic===t)&&(!q||(x.title+' '+x.topic).toLowerCase().includes(q)));count.textContent=items.length+' Visuals';grid.innerHTML=items.map(x=>`<article class="card" data-id="${x.id}"><div class="preview">${preview(x)}<div class="badges">${x.new?'<span class="badge new">NEU</span>':''}<span class="badge">${x.format.toUpperCase()}</span></div></div><div class="body"><h3>${x.title}</h3><div class="meta">${x.platforms.join(' · ')} · ${x.topic}</div><div class="btn">Visual ansehen</div></div></article>`).join('')||'<div class="empty">Keine passenden Visuals gefunden.</div>';document.querySelectorAll('.card').forEach(e=>e.onclick=()=>openItem(e.dataset.id))}function showSlide(){let fs=filesOf(current),u=fs[slide];modalMedia.innerHTML=oneMedia(u,current.format,true)+(fs.length>1?`<button class="navarrow prev" onclick="move(-1)">‹</button><button class="navarrow next" onclick="move(1)">›</button><span class="slidecount">${slide+1} / ${fs.length}</span>`:'');downloadBtn.href=u||'#';downloadBtn.textContent=fs.length>1?`Slide ${slide+1} herunterladen ↓`:'Datei herunterladen ↓';downloadBtn.style.display=u?'block':'none'}function move(n){let fs=filesOf(current);slide=(slide+n+fs.length)%fs.length;showSlide()}function openItem(id){current=content.find(i=>String(i.id)===String(id));slide=0;modalTitle.textContent=current.title;modalMeta.textContent=current.platforms.join(' · ')+' · '+current.format+' · '+current.topic;downloadAllBtn.style.display=filesOf(current).length>1?'block':'none';showSlide();detail.showModal()}downloadAllBtn.onclick=()=>filesOf(current).forEach((u,i)=>setTimeout(()=>{let a=document.createElement('a');a.href=u;a.download=`${current.title}-${i+1}`;a.click()},i*300));document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>{document.querySelectorAll('.platform').forEach(x=>x.classList.remove('active'));b.classList.add('active');platform=b.dataset.platform;render()});['search','format','topic'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='search'?'input':'change',render));fileInput.onchange=()=>{chosenFiles=[...fileInput.files];uploadPreview.style.display='flex';uploadPreview.innerHTML=chosenFiles.map(f=>{let u=URL.createObjectURL(f);return f.type.startsWith('video/')?`<video muted src="${u}"></video>`:`<img src="${u}">`}).join('');if(chosenFiles.length>1)upFormat.value='Carousel';dropTitle.textContent=chosenFiles.length+' Datei'+(chosenFiles.length===1?'':'en')+' ausgewählt'};upFormat.onchange=()=>{fileInput.multiple=upFormat.value==='Carousel';dropHint.textContent=upFormat.value==='Carousel'?'Mehrere Bilder/Videos für einen Carousel-Post auswählen':'Eine Datei auswählen'};publishBtn.onclick=()=>{let ps=[...document.querySelectorAll('[name=upPlatform]:checked')].map(x=>x.value);if(!chosenFiles.length||!upTitle.value.trim()||!upTopic.value.trim()||!ps.length){uploadStatus.style.display='block';uploadStatus.textContent='Bitte Datei(en), Titel, Thema und mindestens eine Plattform auswählen.';return}if(upFormat.value==='Carousel'&&chosenFiles.length<2){uploadStatus.style.display='block';uploadStatus.textContent='Für einen Carousel-Post bitte mindestens zwei Dateien auswählen.';return}let urls=chosenFiles.map(URL.createObjectURL);content.unshift({id:'local-'+Date.now(),title:upTitle.value.trim(),topic:upTopic.value.trim(),format:upFormat.value,platforms:ps,new:true,file:urls[0],files:upFormat.value==='Carousel'?urls:undefined});buildTopics();render();uploadDialog.close();chosenFiles=[];fileInput.value='';uploadPreview.style.display='none';upTitle.value='';upTopic.value='';document.querySelectorAll('[name=upPlatform]').forEach(x=>x.checked=false)};</script></body></html>
